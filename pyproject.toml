[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-commander"
version = "1.0.0"
description = "Advanced Dual Pane File Manager for Windows"
readme = "README.md"
authors = [{ name = "Ultimate Commander Team" }]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7.0",
    "psutil>=5.9.0",
    "pywin32>=306",
    "paramiko>=3.4.0",
    "py7zr>=0.21.0",
    "Pillow>=10.3.0",
    "chardet>=5.2.0",
    "filetype>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[project.gui-scripts]
ultimate-commander = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
